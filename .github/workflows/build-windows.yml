name: Build Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  BASE_VERSION: "0.1"

permissions:
  contents: read

jobs:
  ffmpeg-build:
    name: Build FFmpeg 7.1.5 / FFprobe for Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached FFmpeg 7.1.5 binaries
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg-build/output
          key: ffmpeg-7.1.5-win64-ubuntu2404-mingw-v1-${{ hashFiles('build_ffmpeg.sh', 'ffmpeg-nvenc-rate.patch') }}

      - name: Install cross-build dependencies
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 nasm yasm cmake clang llvm pkg-config \
            autoconf automake libtool python3

      - name: Cross-compile pinned sources and NVENC patch
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          JOBS: "4"
        run: bash build_ffmpeg.sh "$GITHUB_WORKSPACE/.ffmpeg-build"

      - name: Verify cross-compiled tools and provenance
        run: |
          set -euo pipefail
          file .ffmpeg-build/output/ffmpeg.exe | grep -q "PE32+ executable"
          file .ffmpeg-build/output/ffprobe.exe | grep -q "PE32+ executable"
          test -s .ffmpeg-build/output/sources.txt
          grep -q "b35605ace3ddf7c1a5d67a2eb553f034aef41d55" .ffmpeg-build/output/sources.txt
          # Verify both cached and freshly compiled executables against their recorded hashes.
          for exe in ffmpeg.exe ffprobe.exe; do
            expected=$(awk -v exe="$exe" '$2 ~ ("/" exe "$") { print $1 }' .ffmpeg-build/output/sources.txt)
            test "$expected" != ""
            actual=$(sha256sum ".ffmpeg-build/output/$exe" | cut -d ' ' -f 1)
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::FFmpeg cache/build integrity check failed: $exe"
              exit 1
            fi
          done
          # Ensure the cached sources are exactly those in this checkout.
          for source in build_ffmpeg.sh ffmpeg-nvenc-rate.patch; do
            expected=$(awk -v source="$source" '$2 ~ ("/" source "$") { print $1 }' .ffmpeg-build/output/sources.txt)
            test "$expected" != ""
            actual=$(sha256sum "$source" | cut -d ' ' -f 1)
            test "$expected" = "$actual"
          done
          echo "FFmpeg 7.1.5 binary integrity and source revision verified"

      - name: Save verified FFmpeg binaries to cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ffmpeg-build/output
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Upload FFmpeg 7.1.5 toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-7.1.5-windows-x64
          path: |
            .ffmpeg-build/output/ffmpeg.exe
            .ffmpeg-build/output/ffprobe.exe
            .ffmpeg-build/output/sources.txt
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows x64 portable ZIP
    needs: ffmpeg-build
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Stamp app version
        shell: pwsh
        run: |
          python scripts/stamp_version.py "$env:BASE_VERSION" "$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw "Version stamping failed" }

      - name: Check source and release tests
        shell: pwsh
        run: |
          python -m compileall -q main.py ffmpeg.py window.py merge.py version.py scripts test_main.py test_release.py
          if ($LASTEXITCODE -ne 0) { throw "Compilation checks failed" }
          python -m unittest -v test_release
          if ($LASTEXITCODE -ne 0) { throw "Release unit tests failed" }

      - name: Download freshly built FFmpeg and FFprobe
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-7.1.5-windows-x64
          path: tools

      - name: Check binary versions, features and NVENC patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/check_ffmpeg_toolchain.py tools/ffmpeg.exe tools/ffprobe.exe
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg does not match Videoglue requirements" }
          if (-not (Test-Path tools/sources.txt -PathType Leaf)) { throw "Missing FFmpeg source manifest" }
          Copy-Item tools/ffmpeg.exe ffmpeg.exe
          Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path tools).Path
          $version = & tools/ffmpeg.exe -version | Select-Object -First 1
          Set-Content tools/FFMPEG_VERSION.txt -Value $version -Encoding utf8
          Invoke-WebRequest -Uri https://www.gnu.org/licenses/gpl-3.0.txt -OutFile tools/LICENSE_FFMPEG.txt
          if ((Get-Item tools/LICENSE_FFMPEG.txt).Length -lt 10000) { throw "GPLv3 license download failed" }

      - name: Run application tests
        shell: pwsh
        run: |
          python -m unittest -v test_main
          if ($LASTEXITCODE -ne 0) { throw "Application tests failed" }

      - name: Build onefile EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean Videoglue.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (-not (Test-Path dist/Videoglue.exe -PathType Leaf)) { throw "EXE missing" }
          $toc = & pyi-archive_viewer -l dist/Videoglue.exe | Out-String
          if ($LASTEXITCODE -ne 0 -or $toc -match "ffmpeg\.exe|ffprobe\.exe") {
            throw "External FFmpeg was incorrectly embedded"
          }

      - name: Stage and validate portable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "$env:BASE_VERSION.$env:GITHUB_RUN_NUMBER"
          $folder = "release/Videoglue"
          if (Test-Path $folder) { Remove-Item $folder -Recurse -Force }
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item dist/Videoglue.exe $folder
          Copy-Item tools/ffmpeg.exe $folder
          Copy-Item tools/ffprobe.exe $folder
          Copy-Item tools/FFMPEG_VERSION.txt $folder
          Copy-Item tools/LICENSE_FFMPEG.txt $folder
          Copy-Item tools/sources.txt "$folder/FFMPEG_SOURCES.txt"
          Copy-Item build_ffmpeg.sh "$folder/FFMPEG_BUILD.sh"
          Copy-Item ffmpeg-nvenc-rate.patch "$folder/FFMPEG_NVENC.patch"
          Copy-Item LICENSE $folder
          Copy-Item THIRD_PARTY_NOTICES.md $folder
          Set-Content "$folder/VERSION.txt" -Value $version -Encoding utf8
          $expected = @("Videoglue.exe","ffmpeg.exe","ffprobe.exe","VERSION.txt",
                        "FFMPEG_VERSION.txt","FFMPEG_SOURCES.txt","FFMPEG_BUILD.sh",
                        "FFMPEG_NVENC.patch","LICENSE","LICENSE_FFMPEG.txt","THIRD_PARTY_NOTICES.md")
          $actual = @(Get-ChildItem $folder -File)
          if (@(Get-ChildItem $folder -Directory).Count -or $actual.Count -ne $expected.Count) {
            throw "Unexpected staging layout"
          }
          foreach ($file in $actual) {
            if ($file.Name -notin $expected -or $file.Length -le 0) { throw "Invalid staging file $($file.Name)" }
          }
          Write-Host "Verified staging folder $folder ($($expected.Count) files)"

      - name: Upload portable program
        uses: actions/upload-artifact@v4
        with:
          name: Videoglue-v${{ env.BASE_VERSION }}.${{ github.run_number }}-windows-x64
          path: release/Videoglue/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows-portable
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download successful artifact
        uses: actions/download-artifact@v4
        with:
          name: Videoglue-v${{ env.BASE_VERSION }}.${{ github.run_number }}-windows-x64
          path: release

      - name: Package downloaded files for GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          folder = Path("release")
          expected = {
              "Videoglue.exe", "ffmpeg.exe", "ffprobe.exe", "VERSION.txt",
              "FFMPEG_VERSION.txt", "FFMPEG_SOURCES.txt", "FFMPEG_BUILD.sh",
              "FFMPEG_NVENC.patch", "LICENSE", "LICENSE_FFMPEG.txt",
              "THIRD_PARTY_NOTICES.md",
          }
          actual = {p.name for p in folder.iterdir()}
          if actual != expected:
              raise SystemExit(f"Unexpected release files: missing={expected - actual}; extra={actual - expected}")
          if any(not (folder / name).is_file() or (folder / name).stat().st_size == 0 for name in expected):
              raise SystemExit("Missing or empty release file")

          archive = folder / f"Videoglue-v{os.environ['BASE_VERSION']}.{os.environ['GITHUB_RUN_NUMBER']}-windows-x64.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as zf:
              for name in sorted(expected):
                  zf.write(folder / name, arcname=name)
          with ZipFile(archive) as zf:
              if set(zf.namelist()) != expected or zf.testzip() is not None:
                  raise SystemExit("Invalid release ZIP contents")
          print(f"Verified release ZIP: {archive}")
          PY

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$BASE_VERSION.$GITHUB_RUN_NUMBER"
          zip="release/Videoglue-$tag-windows-x64.zip"
          test -s "$zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --target "$GITHUB_SHA" \
              --title "Videoglue $tag" \
              --notes "Windows x64, pipeline #$GITHUB_RUN_NUMBER. Распакуйте ZIP в новую папку; FFmpeg/FFprobe лежат рядом с Videoglue.exe." \
              --latest
          fi
